name: Build Forex Pending Signal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android Platform Files
        run: flutter create . --project-name forex_pending_signal --platforms android

      - name: Add Permissions & Native Notification + Storage
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/><uses-permission android:name="android.permission.VIBRATE"\/><queries><package android:name="net.metaquotes.metatrader5"\/><\/queries><application/g' android/app/src/main/AndroidManifest.xml
          printf 'package com.example.forex_pending_signal\nimport android.app.NotificationChannel\nimport android.app.NotificationManager\nimport android.content.Context\nimport android.content.Intent\nimport android.net.Uri\nimport android.os.Build\nimport androidx.core.app.NotificationCompat\nimport androidx.core.app.ActivityCompat\nimport android.Manifest\nimport android.content.pm.PackageManager\nimport io.flutter.embedding.android.FlutterActivity\nimport io.flutter.embedding.engine.FlutterEngine\nimport io.flutter.plugin.common.MethodChannel\nclass MainActivity: FlutterActivity() {\n  override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n    super.configureFlutterEngine(flutterEngine)\n    if (Build.VERSION.SDK_INT >= 33) {\n      if (ActivityCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {\n        ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)\n      }\n    }\n    val prefs = getSharedPreferences("forex_prefs", Context.MODE_PRIVATE)\n    MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "mt5_launcher").setMethodCallHandler { call, result ->\n      when (call.method) {\n        "openMT5" -> {\n          val i = packageManager.getLaunchIntentForPackage("net.metaquotes.metatrader5") ?: packageManager.getLaunchIntentForPackage("net.metaquotes.metatrader4")\n          if (i != null) { startActivity(i); result.success(true) } else {\n            val m = Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=net.metaquotes.metatrader5"))\n            m.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(m); result.success(false)\n          }\n        }\n        "saveSettings" -> {\n          val bal = call.argument<Double>("balance") ?: 100.0\n          val risk = call.argument<Double>("risk") ?: 2.0\n          prefs.edit().putString("balance", bal.toString()).putString("risk", risk.toString()).apply()\n          result.success(true)\n        }\n        "loadSettings" -> {\n          val bal = prefs.getString("balance", "100.0")?.toDoubleOrNull() ?: 100.0\n          val risk = prefs.getString("risk", "2.0")?.toDoubleOrNull() ?: 2.0\n          result.success(mapOf("balance" to bal, "risk" to risk))\n        }\n        "showNotif" -> {\n          val title = call.argument<String>("title") ?: "Sinyal Forex"\n          val body = call.argument<String>("body") ?: ""\n          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager\n          val chId = "forex_signal_ch"\n          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n            val ch = NotificationChannel(chId, "Sinyal Forex S&R", NotificationManager.IMPORTANCE_HIGH)\n            nm.createNotificationChannel(ch)\n          }\n          val notif = NotificationCompat.Builder(this, chId)\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setContentTitle(title)\n            .setContentText(body)\n            .setStyle(NotificationCompat.BigTextStyle().bigText(body))\n            .setPriority(NotificationCompat.PRIORITY_HIGH)\n            .build()\n          nm.notify((System.currentTimeMillis() %% 10000).toInt(), notif)\n          result.success(true)\n        }\n        else -> result.notImplemented()\n      }\n    }\n  }\n}\n' > android/app/src/main/kotlin/com/example/forex_pending_signal/MainActivity.kt

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Sinyal-Pending-Forex
          path: build/app/outputs/flutter-apk/app-release.apk
