name: Build Forex Pending Signal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android Platform Files
        run: flutter create . --project-name forex_pending_signal --platforms android

      - name: Add Internet Permission
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><queries><package android:name="net.metaquotes.metatrader5"\/><\/queries><application/g' android/app/src/main/AndroidManifest.xml
          printf 'package com.example.forex_pending_signal\nimport android.content.Intent\nimport android.net.Uri\nimport io.flutter.embedding.android.FlutterActivity\nimport io.flutter.embedding.engine.FlutterEngine\nimport io.flutter.plugin.common.MethodChannel\nclass MainActivity: FlutterActivity() {\n  override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n    super.configureFlutterEngine(flutterEngine)\n    MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "mt5_launcher").setMethodCallHandler { call, result ->\n      if (call.method == "openMT5") {\n        val i = packageManager.getLaunchIntentForPackage("net.metaquotes.metatrader5") ?: packageManager.getLaunchIntentForPackage("net.metaquotes.metatrader4")\n        if (i != null) { startActivity(i); result.success(true) } else {\n          val m = Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=net.metaquotes.metatrader5"))\n          m.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)\n          startActivity(m)\n          result.success(false)\n        }\n      } else { result.notImplemented() }\n    }\n  }\n}\n' > android/app/src/main/kotlin/com/example/forex_pending_signal/MainActivity.kt

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Sinyal-Pending-Forex
          path: build/app/outputs/flutter-apk/app-release.apk
