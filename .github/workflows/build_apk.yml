name: Build Forex Pending Signal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android Platform Files
        run: flutter create . --project-name forex_pending_signal --platforms android

      - name: Add Internet Permission & Native MT5 Launcher
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><queries><package android:name="net.metaquotes.metatrader5"\/><package android:name="net.metaquotes.metatrader4"\/><\/queries><application/g' android/app/src/main/AndroidManifest.xml
          cat << 'KOTLIN' > android/app/src/main/kotlin/com/example/forex_pending_signal/MainActivity.kt
          package com.example.forex_pending_signal
          import android.content.Intent
          import android.net.Uri
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "mt5_launcher"
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "openMT5") {
                          val launchIntent = packageManager.getLaunchIntentForPackage("net.metaquotes.metatrader5")
                              ?: packageManager.getLaunchIntentForPackage("net.metaquotes.metatrader4")
                          if (launchIntent != null) {
                              startActivity(launchIntent)
                              result.success(true)
                          } else {
                              val marketIntent = Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=net.metaquotes.metatrader5"))
                              marketIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(marketIntent)
                              result.success(false)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          KOTLIN

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Sinyal-Pending-Forex
          path: build/app/outputs/flutter-apk/app-release.apk
